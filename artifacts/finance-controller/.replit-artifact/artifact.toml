kind = "web"
previewPath = "/"
title = "AI Finance Controller"
description = "A polished financial reconciliation dashboard that connects to the existing FastAPI backend, streams reconciliation progress, and surfaces metrics, exceptions, audit trails, and agent investigation results."
version = "1.0.0"
id = "artifacts/finance-controller"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21947

[services.development]
run = "pnpm --filter @workspace/finance-controller run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/finance-controller", "run", "build" ]
serve = "static"
publicDir = "artifacts/finance-controller/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21947"
BASE_PATH = "/"
